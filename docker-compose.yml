version: "3.8"

services:
  app:
    image: webdevops/php-apache:8.2
    container_name: php82-app

    ports:
      - "8080:80"

    volumes:
      - ./bagisto:/app

    environment:
      WEB_DOCUMENT_ROOT: /app/public

    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql8

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bagisto
      MYSQL_USER: bagisto
      MYSQL_PASSWORD: bagisto

    command:
      --default-authentication-plugin=mysql_native_password
      --log-bin-trust-function-creators=1

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin

    ports:
      - "8081:80"

    environment:
      PMA_HOST: mysql

    depends_on:
      - mysql

  nextjs:
    image: node:22

    container_name: nextjs-commerce

    working_dir: /app

    volumes:
      - ./nextjs-commerce-main:/app

    command: sh -c "npm install && npm run dev"

    ports:
      - "3000:3000"

    depends_on:
      - app

volumes:
  mysql_data: